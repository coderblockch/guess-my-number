<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el número</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="card">
        <h1>Adivina el número</h1>
        <p class="subtitle">Estoy pensando en un número entre <strong>1 al 100</strong></p>
        
        <div class="input-group">
            <input type="number" id="guess" placeholder="Ingresa tu número" min="1" max="100">
            <button id="btn-guess">Adivinar</button>
        </div>

        <p id="message" class="message"></p>
        <p id="attempts" class="attempts"></p>

        <button id="btn-reset" class="btn-reset hidden">Reiniciar Juego</button>
    </div>

    <script src="index.js"></script>
    
</body>
</html>
